services:
  - type: web
    name: liftai-backend
    runtime: node
    rootDir: backend
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: POSTHOG_PROJECT_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
    autoDeploy: true
    branch: main
